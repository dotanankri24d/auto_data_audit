name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-ui.lock -e ".[ui,dev]"
      - run: python -m ruff check src tests examples run_ui.py
      - run: python -m pytest -q
      - run: python -m build
      - run: python run_ui.py --prepare-only
      - run: python run_ui.py --offline --prepare-only
  autoencoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_ae.py -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-ui.lock -e ".[ui,dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py -q
