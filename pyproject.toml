[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-audit"
version = "0.1.0"
description = "Investigate tabular label quality and class overlap with inspectable evidence"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "scipy>=1.12,<2", "openpyxl>=3.1,<4", "xlrd>=2.0.1,<3"]

[project.optional-dependencies]
ui = ["streamlit==1.58.0", "plotly==6.8.0"]
ae = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2", "ruff>=0.11,<1", "xlwt==1.3.0"]

[project.scripts]
data-audit = "data_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
